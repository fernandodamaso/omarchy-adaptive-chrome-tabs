name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            LICENSE
            .gitignore
            .editorconfig
            bin/README.md
            research/chrome-adapter/README.md
            research/geometry-arbitration/README.md
            research/geometry-arbitration/LOCAL_RUNBOOK.md
            research/geometry-arbitration/LOCAL_EVIDENCE_TEMPLATE.md
            tests/fixtures/README.md
            tests/fixtures/fdm-822/fixture-schema.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing required file: $path" >&2; exit 1; }
          done

      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          symlinks="$(git ls-files -s | awk '$1 == "120000" { print $4 }')"
          if [[ -n "$symlinks" ]]; then
            echo "symlinks are not allowed:" >&2
            printf '%s\n' "$symlinks" >&2
            exit 1
          fi

      - name: Enforce executable-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          while read -r mode _sha _stage path; do
            [[ "$mode" == "100755" ]] || continue
            case "$path" in
              bin/*|research/*) ;;
              *)
                echo "unexpected executable outside bin/ or research/: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -s)

      - name: Check Markdown whitespace and final newlines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              data = path.read_bytes()
              if data and not data.endswith(b'\n'):
                  bad.append(f'{path}: missing final newline')
              text = data.decode('utf-8')
              for number, line in enumerate(text.splitlines(), 1):
                  if line.endswith('\t'):
                      bad.append(f'{path}:{number}: trailing tab')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY

      - name: Validate shell syntax when scripts exist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Run FDM-822 pure research tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q research/geometry-arbitration tests

      - name: Guard committed fixtures against obvious private browser data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('tests/fixtures')
          patterns = {
              'URL': re.compile(r'https?://|chrome-extension://', re.I),
              'home path': re.compile(r'/(?:home|Users)/[^/\s]+', re.I),
              'profile path/name': re.compile(r'(?:Profile\s+\d+|Default)/(?:Preferences|History|Cookies)?', re.I),
              'email-like account': re.compile(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', re.I),
          }
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path.name == 'README.md' or 'raw' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label} leakage')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Heuristic common-secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY)' -- ':!*.md' ':!LICENSE'; then
            echo 'possible committed secret detected' >&2
            exit 1
          fi
          true

      # FDM-823 may extend this workflow with qmllint, QML tests,
      # adapter tests, and `omarchy plugin validate` after both
      # feasibility gates are reconciled by FDM-826.
